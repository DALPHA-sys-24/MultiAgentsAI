# Recherche d'hyperparamètres (Optuna) d'UN resnet20 sur chaque dataset ; une tâche = un worker.
#   python -m experiments.campaign hyperparameter_search --list
#   sbatch --array=0-<N-1> slurm/campaign.sh hyperparameter_search
experiment: hyperparameter_search
datasets: [fashion_mnist, cifar10]
settings:
  arch: resnet20
  n_workers: 8
  n_trials: 10                # par worker : 8 x 10 = 80 essais par dataset
