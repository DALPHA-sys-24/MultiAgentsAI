# Agents hétérogènes : une architecture par agent, séparées par "+" (K = nombre d'architectures),
# comme le tableau CIFAR-100 de DML (Zhang et al., 2018). Chaque paire est comparée à alpha = 0 :
# les mêmes architectures entraînées seules (cross-entropy). Pas de grand modèle (reference: false).
#   Résultats : results/heterogeneous/<dataset>/<arch1>+<arch2>_2agents/<méthode>/alpha<a>/
#   summary.csv donne l'accuracy de chaque agent (agent1_resnet32, agent2_mobilenetv2...).
#   python -m experiments.campaign heterogeneous --list
#   sbatch --array=0-<N-1> slurm/campaign.sh heterogeneous
# resnet32 seul (num_agents: 2) : paire homogène de contrôle.
# Paramètres réglés (use_tuned_params) : chaque agent prend l'optimiseur, le lr et le weight decay de la recherche
# de SON architecture (results/hyperparameter_search/<dataset>/<arch>/) ; les réglages communs (batch, warmup...)
# viennent de l'architecture du premier agent. Il faut une recherche pour chaque architecture de la paire
# (campagne hyperparameter_search), sinon ce sont les valeurs des configs. À la main : lr: [0.01, 0.005].
experiment: collaboration
datasets: [cifar100]
methods: [global_interaction, dml, global_interaction_additive, global_interaction_kl, global_interaction_kl_additive]
use_tuned_params: true
settings:
  num_agents: 2                     # pour les architectures seules (ici resnet32) ; ignoré pour a+b
  epochs: 200
  n_runs: 5
grid:
  arch: [resnet32+mobilenetv2, resnet56+resnet20, resnet32]
  alpha: [0, 1]
reference: false
